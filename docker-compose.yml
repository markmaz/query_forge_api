services:
  caddy:
    image: caddy:2-alpine
    environment:
      QF_SITE_ADDRESS: ${QF_SITE_ADDRESS:-:80}
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
      mcp:
        condition: service_started
    ports:
      - "${QF_HTTP_PORT:-80}:80"
      - "${QF_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  frontend:
    build:
      context: ${QF_UI_BUILD_CONTEXT:-../query-forge-ui}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: query-forge-ui:${QF_IMAGE_TAG:-local}
    depends_on:
      api:
        condition: service_started
    expose:
      - "80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: query-forge-api:${QF_IMAGE_TAG:-local}
    env_file:
      - ${QF_ENV_FILE:-deploy/docker/query-forge.env}
    depends_on:
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_started
    expose:
      - "8000"
    restart: unless-stopped

  mcp:
    image: query-forge-api:${QF_IMAGE_TAG:-local}
    env_file:
      - ${QF_ENV_FILE:-deploy/docker/query-forge.env}
    command: ["python", "-m", "mcp_server"]
    depends_on:
      api:
        condition: service_started
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_started
    expose:
      - "8001"
    restart: unless-stopped

  celery-worker:
    image: query-forge-api:${QF_IMAGE_TAG:-local}
    env_file:
      - ${QF_ENV_FILE:-deploy/docker/query-forge.env}
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_started
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    image: query-forge-api:${QF_IMAGE_TAG:-local}
    env_file:
      - ${QF_ENV_FILE:-deploy/docker/query-forge.env}
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/query-forge/celerybeat-schedule"]
    depends_on:
      api:
        condition: service_started
      valkey:
        condition: service_healthy
    volumes:
      - celery-beat:/var/lib/query-forge
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    restart: unless-stopped

volumes:
  caddy-config:
  caddy-data:
  celery-beat:
  qdrant-data:
  valkey-data:
