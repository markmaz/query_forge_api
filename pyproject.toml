[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workboard-api"
version = "0.0.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "workboard_api.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
omit = [
    "app/adapters/*",
    "app/main.py",
    "app/routes/*",
    "app/tasks/*",
    "app/tester.py",
    "app/services/databricks_query_service.py",
    "app/services/dashboard_service.py",
    "wsgi.py",
]
