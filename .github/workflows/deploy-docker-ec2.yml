name: Deploy Docker to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-docker-ec2
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/query-forge
  QF_UI_REPOSITORY: ${{ vars.QF_UI_REPOSITORY || 'markmaz/query_forge_ui' }}
  QF_UI_REF: ${{ vars.QF_UI_REF || github.ref_name }}
  EC2_PORT: ${{ vars.EC2_PORT || '22' }}
  EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/opt/query-forge' }}
  QF_HTTP_PORT: ${{ vars.QF_HTTP_PORT || '80' }}
  QF_HTTPS_PORT: ${{ vars.QF_HTTPS_PORT || '443' }}
  QF_RUN_MIGRATIONS: ${{ vars.QF_RUN_MIGRATIONS || 'false' }}

jobs:
  build-and-deploy:
    name: Build images and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QF_UI_REPOSITORY }}
          ref: ${{ env.QF_UI_REF }}
          path: query-forge-ui
          token: ${{ secrets.QF_UI_REPO_TOKEN || github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: query-forge-ui
          file: query-forge-ui/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ui:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-ui:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || secrets.VITE_API_URL || '/api/v1' }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail
          echo "api=${IMAGE_PREFIX}-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ui=${IMAGE_PREFIX}-ui:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -p "$EC2_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ec2_deploy_key -p "$EC2_PORT" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p '$EC2_DEPLOY_PATH/compose/deploy/docker/caddy' /tmp/query-forge-deploy"
          scp -i ~/.ssh/ec2_deploy_key -P "$EC2_PORT" \
            docker-compose.yml docker-compose.prod.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$EC2_DEPLOY_PATH/compose/"
          scp -i ~/.ssh/ec2_deploy_key -P "$EC2_PORT" deploy/docker/caddy/Caddyfile \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$EC2_DEPLOY_PATH/compose/deploy/docker/caddy/Caddyfile"
          scp -i ~/.ssh/ec2_deploy_key -P "$EC2_PORT" scripts/deploy/ec2_docker_deploy.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/query-forge-deploy/ec2_docker_deploy.sh"

      - name: Deploy on EC2
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ec2_deploy_key -p "$EC2_PORT" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "chmod +x /tmp/query-forge-deploy/ec2_docker_deploy.sh && \
             QF_APP_DIR='$EC2_DEPLOY_PATH' \
             QF_RELEASE_ID='${{ github.sha }}' \
             QF_API_IMAGE='${{ steps.images.outputs.api }}' \
             QF_UI_IMAGE='${{ steps.images.outputs.ui }}' \
             QF_HTTP_PORT='$QF_HTTP_PORT' \
             QF_HTTPS_PORT='$QF_HTTPS_PORT' \
             QF_RUN_MIGRATIONS='$QF_RUN_MIGRATIONS' \
             GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' \
             GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             /tmp/query-forge-deploy/ec2_docker_deploy.sh"
